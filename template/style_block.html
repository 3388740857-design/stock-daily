<style>
:root {
  --bg: #f8fafc; --card: #fff; --text: #1e293b; --muted: #64748b;
  --border: #e2e8f0; --accent: #1e40af; --red: #dc2626; --green: #16a34a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.7; padding: 20px 16px;
}
.container { max-width: 1200px; margin: 0 auto; }
.header {
  background: linear-gradient(135deg, #1e3a5f 0%, #1e40af 100%);
  color: #fff; border-radius: 12px; padding: 28px 32px; margin-bottom: 16px;
}
.header h1 { font-size: 1.5rem; font-weight: 700; }
.header .meta { opacity: 0.85; font-size: 0.88rem; margin-top: 8px; }
.tldr {
  background: var(--card); border: 1px solid #bfdbfe; border-left: 4px solid var(--accent);
  border-radius: 10px; padding: 18px 22px; margin-bottom: 20px;
}
.tldr h2 { font-size: 1rem; color: var(--accent); margin-bottom: 10px; }
.tldr .verdict { font-size: 1.1rem; font-weight: 700; color: #dc2626; margin-bottom: 8px; }
.tldr ul { padding-left: 1.2em; font-size: 0.9rem; }
.tldr li { margin: 5px 0; }
h2.section {
  font-size: 1.08rem; font-weight: 600; margin: 28px 0 14px;
  padding-bottom: 8px; border-bottom: 2px solid var(--accent); color: var(--accent);
}
.focus-badge {
  display: inline-block; background: #dc2626; color: #fff; font-size: 0.72rem;
  font-weight: 700; padding: 2px 8px; border-radius: 4px; margin-right: 8px; vertical-align: middle;
}
.grid { display: grid; gap: 12px; margin-bottom: 16px; }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
.grid-4 { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 18px;
}
.card .label { font-size: 0.8rem; color: var(--muted); font-weight: 500; }
.card .val { font-size: 1.45rem; font-weight: 700; margin-top: 4px; }
.card .sub { font-size: 0.84rem; color: var(--muted); margin-top: 4px; }
.up { color: var(--red); } .down { color: var(--green); }
.chart-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
.chart-box h3 { font-size: 0.95rem; margin-bottom: 8px; color: var(--accent); }
.chart-box .chart { width: 100%; }
.chart-box .chart svg { width: 100%; height: auto; display: block; }
.analysis-block {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px 22px; margin-bottom: 14px;
}
.analysis-block h3 { font-size: 0.95rem; color: var(--accent); margin-bottom: 10px; }
.analysis-block p { font-size: 0.9rem; margin: 6px 0; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 16px; }
th { background: #f1f5f9; color: var(--muted); font-weight: 500; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 500; }
.tag-red { background: #fef2f2; color: #dc2626; }
.tag-green { background: #f0fdf4; color: #16a34a; }
.tag-blue { background: #eff6ff; color: #2563eb; }
.tag-orange { background: #fff7ed; color: #ea580c; }
.tag-purple { background: #faf5ff; color: #9333ea; }
.highlight-box {
  background: linear-gradient(135deg, #fef2f2 0%, #fff7ed 100%);
  border: 1px solid #fecaca; border-radius: 10px; padding: 16px 20px; margin-bottom: 16px;
}
.highlight-box h3 { color: #dc2626; font-size: 0.95rem; margin-bottom: 8px; }
.highlight-box p { font-size: 0.88rem; margin: 4px 0; }
.footer {
  margin-top: 32px; padding: 14px; border-top: 1px solid var(--border);
  color: var(--muted); font-size: 0.78rem; text-align: center; line-height: 1.8;
}
.warn { color: #ea580c; font-weight: 500; }
.src { font-size: 0.72rem; color: var(--muted); margin-top: -8px; margin-bottom: 14px; }
@media print {
  .chart-box, .analysis-block, .card, .highlight-box, table, .tldr { page-break-inside: avoid; break-inside: avoid; }
  h2.section { page-break-after: avoid; break-after: avoid; }
  .grid { page-break-inside: avoid; break-inside: avoid; }
}
</style>
